<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      .container {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        border-right: 1px solid #ccc;
        padding: 1.25rem 1rem;
      }
      .sidebar h2 {
        margin-top: 0;
        font-size: 1.1rem;
      }
      .sidebar ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .sidebar li + li {
        margin-top: 0.5rem;
      }
      .sidebar a {
        text-decoration: none;
      }
      .sidebar a.active {
        font-weight: 700;
        text-decoration: underline;
      }
      main {
        padding: 1.5rem;
        max-width: 900px;
      }
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid #ccc;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      {% include sidebar.html %}
      <main>
        <h1>{{ page.title }}</h1>
        {{ content }}
      </main>
    </div>
  </body>
</html>
